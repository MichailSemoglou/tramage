name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:17 UTC: catch upstream deprecations proactively.
    - cron: "17 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install ruff codespell

      - name: Ruff
        run: ruff check src tests

      - name: Codespell
        run: codespell src tests docs README.md

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  build-check:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build the distribution
        run: python -m build

      - name: Install the wheel into a fresh environment and smoke-test it
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install dist/*.whl
          /tmp/wheelcheck/bin/python -c "import tramage; print(tramage.__version__)"
          /tmp/wheelcheck/bin/python -c "
          from tramage.diffusion import diffuse
          import numpy as np
          img = np.zeros((8, 8, 3))
          pal = np.array([[0.5, 0.0, 0.0], [0.6, 0.0, 0.0]])
          dithered, _ = diffuse(img, pal)
          assert dithered.shape == img.shape
          "
