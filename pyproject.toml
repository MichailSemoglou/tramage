[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tramage"
dynamic = ["version"]
description = "Palette-structure-aware error diffusion dithering."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Michail Semoglou", email = "hello@qide.studio" },
]
keywords = ["dithering", "error-diffusion", "colour", "oklab", "palette", "printmaking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
image = ["pillow>=10.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://qide.studio"
Repository = "https://github.com/MichailSemoglou/tramage"
Issues = "https://github.com/MichailSemoglou/tramage/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tramage"]

[tool.hatch.version]
path = "src/tramage/__init__.py"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 50

[tool.codespell]
skip = ".git,*.pdf,*.png,*.csv,.venv"
ignore-words-list = "oklab,nd,hist"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--durations=10"]
# Warnings are errors: deprecations surface here, not in production.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: correctness. I: import sorting. UP: pyupgrade. D: docstring drift
# (pydocstyle), added once the documentation review landed. Excluded
# deliberately: D103/D105 (a docstring on every public function, including
# tests — the suite documents behavior in prose where needed) and D401
# (imperative mood; the package's docstrings favor plain descriptive style).
select = ["E", "F", "I", "UP", "D"]
ignore = ["D103", "D105", "D401"]
